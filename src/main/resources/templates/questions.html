<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Bank Portal</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
  <div th:replace="~{fragments :: navbar('questions')}"></div>
  <div class="container">
    <h1>Automated Question Bank Portal</h1>
    <p class="subtitle">Choose a subject folder and add a question. After saving, you are taken to that folder.</p>

    <div class="toast" th:if="${message}" th:text="${message}"></div>

    <form class="card" th:action="@{/questions}" th:object="${question}" method="post">
      <div class="form-grid">
        <div class="full">
          <label class="lbl" for="text">Question</label>
          <textarea id="text" th:field="*{text}" rows="3" placeholder="Type the question here"></textarea>
          <span class="error" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span>
        </div>
        <div>
          <label class="lbl" for="subject">Subject (folder)</label>
          <select id="subject" th:field="*{subject}">
            <option value="">-- Select a folder --</option>
            <option th:each="s : ${subjects}" th:value="${s}" th:text="${s}"></option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></span>
        </div>
        <div>
          <label class="lbl" for="topic">Topic</label>
          <input id="topic" type="text" th:field="*{topic}" placeholder="e.g. Jenkins, CNN, Tokenization">
        </div>
        <div>
          <label class="lbl" for="difficulty">Difficulty</label>
          <select id="difficulty" th:field="*{difficulty}">
            <option value="">-- Select --</option>
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
          </select>
          <span class="error" th:if="${#fields.hasErrors('difficulty')}" th:errors="*{difficulty}"></span>
        </div>
        <div style="align-self:end">
          <button id="saveBtn" class="btn" type="submit">Save Question</button>
        </div>
      </div>
    </form>

    <h2>All Questions</h2>
    <form class="bar" th:action="@{/questions}" method="get">
      <input id="keyword" type="text" name="keyword" th:value="${keyword}" placeholder="Search text, subject or topic">
      <select id="statusFilter" name="status">
        <option value="">All statuses</option>
        <option value="DRAFT" th:selected="${statusFilter == 'DRAFT'}">Draft</option>
        <option value="SUBMITTED" th:selected="${statusFilter == 'SUBMITTED'}">Submitted</option>
        <option value="APPROVED" th:selected="${statusFilter == 'APPROVED'}">Approved</option>
        <option value="REJECTED" th:selected="${statusFilter == 'REJECTED'}">Rejected</option>
      </select>
      <button id="searchBtn" class="btn" type="submit">Search</button>
      <a th:href="@{/questions}">Clear</a>
    </form>

    <div class="table-wrap">
      <table th:replace="~{fragments :: qtable(${questions})}"></table>
    </div>
  </div>
</body>
</html>
