<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject} + ' | Question Bank'">Folder</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
  <div th:replace="~{fragments :: navbar('folders')}"></div>
  <div class="container">
    <div class="crumbs"><a th:href="@{/folders}">Folders</a> / <span th:text="${subject}">DevOps</span></div>

    <div class="folder-head">
      <div class="folder-title">
        <div class="folder-icon" th:text="${icon}">F</div>
        <div>
          <h1 th:text="${subject}">DevOps</h1>
          <p class="subtitle"><span th:text="${folder.total}">0</span> question(s) in this folder</p>
        </div>
      </div>
      <a class="btn" th:href="@{/questions(subject=${subject})}">+ Add question to this folder</a>
    </div>

    <div class="toast" th:if="${message}" th:text="${message}"></div>

    <div class="pills">
      <a class="pill" th:classappend="${statusFilter == ''} ? 'on'"
         th:href="@{/folders/{s}(s=${subject})}" th:text="'All (' + ${folder.total} + ')'">All</a>
      <a class="pill" th:classappend="${statusFilter == 'DRAFT'} ? 'on'"
         th:href="@{/folders/{s}(s=${subject},status='DRAFT')}" th:text="'Draft (' + ${folder.draft} + ')'">Draft</a>
      <a class="pill" th:classappend="${statusFilter == 'SUBMITTED'} ? 'on'"
         th:href="@{/folders/{s}(s=${subject},status='SUBMITTED')}" th:text="'Submitted (' + ${folder.submitted} + ')'">Submitted</a>
      <a class="pill" th:classappend="${statusFilter == 'APPROVED'} ? 'on'"
         th:href="@{/folders/{s}(s=${subject},status='APPROVED')}" th:text="'Approved (' + ${folder.approved} + ')'">Approved</a>
      <a class="pill" th:classappend="${statusFilter == 'REJECTED'} ? 'on'"
         th:href="@{/folders/{s}(s=${subject},status='REJECTED')}" th:text="'Rejected (' + ${folder.rejected} + ')'">Rejected</a>
    </div>

    <div class="table-wrap">
      <table th:replace="~{fragments :: qtable(${questions})}"></table>
    </div>
  </div>
</body>
</html>
